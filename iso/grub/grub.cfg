set default=0
set timeout=8
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png

if loadfont /boot/grub/fonts/unicode.pf2; then
  set gfxmode=auto
  terminal_output gfxterm
fi

if background_image /boot/grub/splash.png; then
  set color_normal=light-cyan/black
  set menu_color_normal=white/black
  set menu_color_highlight=black/cyan
fi

menuentry "FlowOS Desktop  (live — no persistence)" {
  linux  /boot/vmlinuz quiet loglevel=0 console=tty1
  initrd /boot/initrd.img
}

menuentry "FlowOS Desktop  (persistent — saves changes)" {
  linux  /boot/vmlinuz quiet loglevel=0 console=tty1 persistent
  initrd /boot/initrd.img
}

menuentry "FlowOS Desktop  (RAM mode — copy to RAM)" {
  linux  /boot/vmlinuz quiet loglevel=0 console=tty1 copytoram
  initrd /boot/initrd.img
}

menuentry "FlowOS Desktop  (verbose boot)" {
  linux  /boot/vmlinuz console=tty1
  initrd /boot/initrd.img
}

menuentry "Boot installed OS  (Windows / macOS / Linux)" {
  insmod chain
  insmod part_gpt
  insmod part_msdos
  set root=(hd0)
  chainloader +1
}
