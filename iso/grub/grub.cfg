set default=0
set timeout=5
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod gfxmenu

if loadfont /boot/grub/fonts/unicode.pf2; then
  set gfxmode=auto
  terminal_output gfxterm
fi

menuentry "FlowOS Desktop" {
  linux  /boot/vmlinuz quiet loglevel=0 console=tty1
  initrd /boot/initrd.img
}

menuentry "FlowOS Desktop (verbose)" {
  linux  /boot/vmlinuz console=tty1
  initrd /boot/initrd.img
}

menuentry "FlowOS Desktop (RAM mode — copy to RAM)" {
  linux  /boot/vmlinuz quiet loglevel=0 console=tty1 copytoram
  initrd /boot/initrd.img
}

menuentry "Boot from first hard disk" {
  insmod chain
  set root=(hd0)
  chainloader +1
}
