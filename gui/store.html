<!doctype html>
<meta charset="utf-8">
<title>FlowOS — Plugin Store</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #080D14;
    --surface:     #0F1923;
    --surface-2:   #162030;
    --border:      #1E2D3D;
    --border-2:    #243547;
    --accent:      #00B4D8;
    --accent-dim:  rgba(0,180,216,0.12);
    --accent-glow: rgba(0,180,216,0.06);
    --text:        #CDD9E5;
    --text-muted:  #5C7A99;
    --text-dim:    #3A5470;
    --on:          #22C55E;
    --on-dim:      rgba(34,197,94,0.15);
    --tag-dev:     #7C3AED;
    --tag-media:   #DB2777;
    --tag-sys:     #EA580C;
    --tag-prod:    #0891B2;
    --sidebar-w:   228px;
    --header-h:    56px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:        #F0F4F8;
      --surface:   #FFFFFF;
      --surface-2: #EAF0F6;
      --border:    #C8D8E8;
      --border-2:  #B0C4D8;
      --accent:    #0077A8;
      --accent-dim:rgba(0,119,168,0.1);
      --accent-glow:rgba(0,119,168,0.04);
      --text:      #0F1923;
      --text-muted:#4A6A88;
      --text-dim:  #8AAABB;
      --on:        #16A34A;
      --on-dim:    rgba(22,163,74,0.12);
    }
  }
  :root[data-theme="dark"] {
    --bg:#080D14;--surface:#0F1923;--surface-2:#162030;--border:#1E2D3D;--border-2:#243547;
    --accent:#00B4D8;--accent-dim:rgba(0,180,216,0.12);--accent-glow:rgba(0,180,216,0.06);
    --text:#CDD9E5;--text-muted:#5C7A99;--text-dim:#3A5470;
    --on:#22C55E;--on-dim:rgba(34,197,94,0.15);
  }
  :root[data-theme="light"] {
    --bg:#F0F4F8;--surface:#FFFFFF;--surface-2:#EAF0F6;--border:#C8D8E8;--border-2:#B0C4D8;
    --accent:#0077A8;--accent-dim:rgba(0,119,168,0.1);--accent-glow:rgba(0,119,168,0.04);
    --text:#0F1923;--text-muted:#4A6A88;--text-dim:#8AAABB;
    --on:#16A34A;--on-dim:rgba(22,163,74,0.12);
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; font-size: 14px; line-height: 1.5; }

  /* ── LAYOUT ── */
  .layout { display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: var(--header-h) 1fr; height: 100vh; }

  /* ── HEADER ── */
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, #00B4D8 0%, #0077A8 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; font-weight: 700; letter-spacing: -0.5px;
  }
  .logo-text { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
  .logo-text span { color: var(--text-muted); font-weight: 400; }
  .search-wrap { flex: 1; max-width: 400px; position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.35; pointer-events: none; }
  #search {
    width: 100%; height: 32px; padding: 0 10px 0 32px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px;
    outline: none; transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-dim); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .sys-stats { display: flex; gap: 14px; font-size: 11px; font-family: 'SF Mono','Fira Code',Consolas,monospace; color: var(--text-muted); }
  .sys-stat { display: flex; align-items: center; gap: 5px; }
  .sys-stat-bar { width: 36px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .sys-stat-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .6s; }
  .btn-launch {
    height: 30px; padding: 0 14px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.2px;
    transition: opacity .15s, transform .1s;
  }
  .btn-launch:hover { opacity: .85; }
  .btn-launch:active { transform: scale(.97); }

  /* ── SIDEBAR ── */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    overflow-y: auto;
    /* scan-line texture — terminal heritage */
    position: relative;
  }
  aside::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.03) 4px);
    z-index: 0;
  }
  .sidebar-section { position: relative; z-index: 1; }
  .sidebar-label {
    padding: 0 16px 6px; font-size: 10px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim);
  }
  .cat-btn {
    display: flex; align-items: center; gap: 9px;
    width: 100%; padding: 7px 16px;
    background: none; border: none; color: var(--text-muted);
    font-size: 13px; cursor: pointer; text-align: left;
    transition: background .1s, color .1s;
    border-left: 2px solid transparent;
  }
  .cat-btn:hover { background: var(--surface-2); color: var(--text); }
  .cat-btn.active { background: var(--accent-dim); color: var(--accent); border-left-color: var(--accent); }
  .cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .cat-count { margin-left: auto; font-size: 11px; font-family: 'SF Mono','Fira Code',Consolas,monospace; opacity: .6; }

  .sidebar-divider { height: 1px; background: var(--border); margin: 10px 16px; }

  .active-count {
    margin: 12px 16px 0; padding: 10px 12px;
    background: var(--on-dim); border: 1px solid rgba(34,197,94,.2);
    border-radius: 8px; font-size: 11px; color: var(--on);
    font-family: 'SF Mono','Fira Code',Consolas,monospace;
    position: relative; z-index: 1;
  }
  .active-count strong { font-size: 18px; display: block; font-weight: 700; line-height: 1.2; }

  /* ── MAIN ── */
  main { overflow-y: auto; padding: 24px 24px 56px; background: var(--bg); }
  .grid-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
  .grid-title { font-size: 16px; font-weight: 600; }
  .grid-sub { font-size: 12px; color: var(--text-muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

  /* ── PLUGIN CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    transition: border-color .2s, background .2s, box-shadow .2s;
    cursor: default;
  }
  .card:hover { border-color: var(--border-2); box-shadow: 0 2px 12px rgba(0,0,0,.18); }
  .card.enabled {
    border-left-color: var(--accent);
    background: linear-gradient(105deg, var(--accent-glow) 0%, var(--surface) 60%);
  }
  .card-top { display: flex; align-items: flex-start; gap: 12px; }
  .card-icon {
    width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; background: var(--surface-2); border: 1px solid var(--border);
  }
  .card-info { flex: 1; min-width: 0; }
  .card-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .card-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
  .badge {
    font-size: 10px; font-weight: 600; letter-spacing: .04em;
    padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
  }
  .badge-dev   { background: rgba(124,58,237,.18); color: #A78BFA; }
  .badge-media { background: rgba(219,39,119,.18); color: #F472B6; }
  .badge-sys   { background: rgba(234,88,12,.18);  color: #FB923C; }
  .badge-prod  { background: rgba(8,145,178,.18);  color: #22D3EE; }
  .badge-snap  { background: rgba(251,191,36,.12); color: #FBBF24; font-family: 'SF Mono','Fira Code',Consolas,monospace; font-weight: 500; text-transform: none; letter-spacing: 0; }

  .card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .snap-hint { font-size: 11px; font-family: 'SF Mono','Fira Code',Consolas,monospace; color: var(--text-dim); }
  .snap-hint code { color: var(--accent); }

  /* ── TOGGLE ── */
  .toggle { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-track {
    position: absolute; inset: 0; border-radius: 11px;
    background: var(--border-2); transition: background .2s;
    cursor: pointer;
  }
  .toggle-track::after {
    content: ''; position: absolute;
    top: 3px; left: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--text-muted);
    transition: transform .2s, background .2s;
  }
  .toggle input:checked + .toggle-track { background: var(--on); }
  .toggle input:checked + .toggle-track::after { transform: translateX(16px); background: #fff; }

  /* ── EMPTY ── */
  .empty { grid-column: 1/-1; text-align: center; padding: 48px 0; color: var(--text-dim); }
  .empty-icon { font-size: 32px; margin-bottom: 10px; }
  .empty p { font-size: 13px; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--surface-2); border: 1px solid var(--border-2);
    border-left: 3px solid var(--accent);
    padding: 10px 16px; border-radius: 8px;
    font-size: 12px; font-family: 'SF Mono','Fira Code',Consolas,monospace;
    color: var(--text); max-width: 320px;
    transform: translateY(80px); opacity: 0;
    transition: transform .25s, opacity .25s;
    z-index: 100;
  }
  #toast.show { transform: translateY(0); opacity: 1; }

  /* ── MODE TABS ── */
  .mode-tabs { display: flex; gap: 4px; padding: 10px 12px 6px; }
  .mode-tab {
    flex: 1; height: 28px; border: none; border-radius: 6px;
    font-size: 12px; font-weight: 600; cursor: pointer; letter-spacing: .01em;
    background: var(--surface-2); color: var(--text-muted);
    transition: background .15s, color .15s;
  }
  .mode-tab.active { background: var(--accent-dim); color: var(--accent); }
  .mode-tab:hover:not(.active) { color: var(--text); }

  .snap-sidebar { display: none; }
  .plugins-sidebar {}
  body.snap-mode .snap-sidebar  { display: block; }
  body.snap-mode .plugins-sidebar { display: none; }
  body.snap-mode #panel-plugins  { display: none; }
  body.snap-mode #panel-snaps    { display: block; }
  #panel-snaps { display: none; }

  /* ── SNAP SEARCH ── */
  .snap-search-row { display: flex; gap: 8px; margin-bottom: 22px; }
  .snap-search-row input {
    flex: 1; height: 36px; padding: 0 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 13px; outline: none;
    transition: border-color .15s;
  }
  .snap-search-row input:focus { border-color: var(--accent); }
  .snap-search-row input::placeholder { color: var(--text-dim); }
  .snap-search-row button {
    height: 36px; padding: 0 18px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  .snap-search-row button:hover { opacity: .85; }

  /* ── SNAP CARDS ── */
  .snap-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    transition: border-color .2s, box-shadow .2s;
  }
  .snap-card:hover { border-color: var(--border-2); box-shadow: 0 2px 12px rgba(0,0,0,.18); }
  .snap-card-top { display: flex; align-items: flex-start; gap: 12px; }
  .snap-icon {
    width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .snap-icon-ph {
    width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
    background: var(--surface-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--text-dim);
  }
  .snap-info { flex: 1; min-width: 0; }
  .snap-title { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .snap-pub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .snap-summary { font-size: 12px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .snap-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .snap-ver { font-size: 11px; font-family: 'SF Mono','Fira Code',Consolas,monospace; color: var(--text-dim); }
  .btn-install {
    height: 28px; padding: 0 14px;
    background: var(--accent-dim); border: 1px solid rgba(0,180,216,.35);
    color: var(--accent); border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn-install:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-install:disabled { opacity: .5; cursor: default; }
  .btn-install.done { background: var(--on-dim); border-color: rgba(34,197,94,.35); color: var(--on); }
  .btn-install.loading { opacity: .6; cursor: wait; }

  /* ── SNAP STATE ── */
  .snap-state { grid-column: 1/-1; text-align: center; padding: 56px 0; color: var(--text-dim); }
  .snap-spinner {
    display: inline-block; width: 22px; height: 22px; margin-bottom: 12px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: var(--header-h) auto 1fr; }
    aside { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .snap-spinner { animation: none; }
  }
</style>

<div class="layout">
  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-mark">F</div>
      <div class="logo-text">FlowOS <span>/ Store</span></div>
    </div>
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="search" placeholder="Search plugins…" autocomplete="off">
    </div>
    <div class="header-right">
      <div class="sys-stats" id="sys-stats"></div>
      <button class="btn-launch" id="btn-launch">Launch FlowOS</button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside>
    <div class="mode-tabs">
      <button class="mode-tab active" id="tab-plugins" onclick="setMode('plugins')">Plugins</button>
      <button class="mode-tab" id="tab-snaps" onclick="setMode('snaps')">Snap Store</button>
    </div>

    <div class="plugins-sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Browse</div>
      <button class="cat-btn active" data-cat="All">
        <span class="cat-dot" style="background:var(--accent)"></span>
        All Plugins
        <span class="cat-count" id="cnt-all">0</span>
      </button>
      <button class="cat-btn" data-cat="Developer">
        <span class="cat-dot" style="background:#7C3AED"></span>
        Developer
        <span class="cat-count" id="cnt-Developer">0</span>
      </button>
      <button class="cat-btn" data-cat="Media">
        <span class="cat-dot" style="background:#DB2777"></span>
        Media
        <span class="cat-count" id="cnt-Media">0</span>
      </button>
      <button class="cat-btn" data-cat="System">
        <span class="cat-dot" style="background:#EA580C"></span>
        System
        <span class="cat-count" id="cnt-System">0</span>
      </button>
      <button class="cat-btn" data-cat="Productivity">
        <span class="cat-dot" style="background:#0891B2"></span>
        Productivity
        <span class="cat-count" id="cnt-Productivity">0</span>
      </button>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
      <div class="active-count">
        <strong id="enabled-n">0</strong>
        plugins active
      </div>
    </div>
    </div><!-- /plugins-sidebar -->

    <div class="snap-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Categories</div>
        <button class="cat-btn active" data-snap-cat="" onclick="snapCategory(this, '')">
          <span class="cat-dot" style="background:var(--accent)"></span>
          Featured
        </button>
        <button class="cat-btn" data-snap-cat="development" onclick="snapCategory(this, 'development')">
          <span class="cat-dot" style="background:#7C3AED"></span>
          Development
        </button>
        <button class="cat-btn" data-snap-cat="productivity" onclick="snapCategory(this, 'productivity')">
          <span class="cat-dot" style="background:#0891B2"></span>
          Productivity
        </button>
        <button class="cat-btn" data-snap-cat="music-and-audio" onclick="snapCategory(this, 'music-and-audio')">
          <span class="cat-dot" style="background:#DB2777"></span>
          Music &amp; Audio
        </button>
        <button class="cat-btn" data-snap-cat="photo-and-video" onclick="snapCategory(this, 'photo-and-video')">
          <span class="cat-dot" style="background:#DB2777"></span>
          Photo &amp; Video
        </button>
        <button class="cat-btn" data-snap-cat="social" onclick="snapCategory(this, 'social')">
          <span class="cat-dot" style="background:#EA580C"></span>
          Social
        </button>
        <button class="cat-btn" data-snap-cat="games" onclick="snapCategory(this, 'games')">
          <span class="cat-dot" style="background:#16A34A"></span>
          Games
        </button>
      </div>
    </div><!-- /snap-sidebar -->
  </aside>

  <!-- MAIN -->
  <main>
    <!-- Plugins panel -->
    <div id="panel-plugins">
      <div class="grid-header">
        <span class="grid-title" id="grid-title">All Plugins</span>
        <span class="grid-sub" id="grid-sub"></span>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <!-- Snap Store panel -->
    <div id="panel-snaps">
      <div class="grid-header">
        <span class="grid-title" id="snap-title">Featured Snaps</span>
        <span class="grid-sub" id="snap-sub"></span>
      </div>
      <div class="snap-search-row">
        <input id="snap-search" type="search" placeholder="Search the Snap Store…" autocomplete="off"
               onkeydown="if(event.key==='Enter') doSnapSearch()">
        <button onclick="doSnapSearch()">Search</button>
      </div>
      <div class="grid" id="snap-grid"></div>
    </div>
  </main>
</div>

<footer style="position:fixed;bottom:0;left:var(--sidebar-w);right:0;height:32px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:20px;font-size:11px;color:var(--text-dim);z-index:9;">
  <a href="https://flowos.wiki" target="_blank" style="color:var(--text-muted);text-decoration:none;transition:color .15s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">flowos.wiki</a>
  <a href="https://projectaquarius.space" target="_blank" style="color:var(--text-muted);text-decoration:none;transition:color .15s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">projectaquarius.space</a>
  <span style="margin-left:auto;font-family:'SF Mono','Fira Code',Consolas,monospace;">FlowOS Desktop v0.2</span>
</footer>
<div id="toast"></div>

<script>
const CAT_BADGE = {
  Developer: 'badge-dev', Media: 'badge-media',
  System: 'badge-sys', Productivity: 'badge-prod'
};
const CAT_ICONS = {
  git: '⎇', docker: '◫', ssh: '⚡', notes: '◧',
  weather: '◎', clipboard: '⊡', browser: '◉', spotify: '◈', homeserver: '⊞'
};

let plugins = [];
let activeCategory = 'All';
let searchQuery = '';

async function fetchPlugins() {
  try {
    const res = await fetch('/api/plugins');
    plugins = await res.json();
  } catch {
    // fallback demo data if API unreachable
    plugins = [
      {name:'git',description:'Git repository management — status, commit, push, branch, log, diff',enabled:true,icon:'⎇',category:'Developer',snap:null,color:'#7C3AED'},
      {name:'docker',description:'Docker container and image management',enabled:false,icon:'◫',category:'Developer',snap:'docker',color:'#7C3AED'},
      {name:'ssh',description:'Run commands on remote machines over SSH',enabled:true,icon:'⚡',category:'Developer',snap:null,color:'#7C3AED'},
      {name:'notes',description:'Persistent note-taking — save, retrieve, and list notes',enabled:true,icon:'◧',category:'Productivity',snap:null,color:'#0891B2'},
      {name:'weather',description:'Current weather and 3-day forecast for any location',enabled:false,icon:'◎',category:'Productivity',snap:null,color:'#0891B2'},
      {name:'clipboard',description:'Read from and write to the system clipboard',enabled:false,icon:'⊡',category:'System',snap:null,color:'#EA580C'},
      {name:'browser',description:'Open URLs, search the web, headless screenshots, fetch page content',enabled:false,icon:'◉',category:'Media',snap:'chromium',color:'#DB2777'},
      {name:'spotify',description:'Control Spotify — play/pause, skip, volume, current track',enabled:true,icon:'◈',category:'Media',snap:'spotify',color:'#DB2777'},
      {name:'homeserver',description:'Manage home server at 192.168.0.169 — status, services, docker, deploy, snaps',enabled:true,icon:'⊞',category:'System',snap:null,color:'#EA580C'},
    ];
  }
  render();
  updateCounts();
}

async function fetchSystem() {
  try {
    const res = await fetch('/api/system');
    const d = await res.json();
    document.getElementById('sys-stats').innerHTML = `
      <div class="sys-stat">CPU<div class="sys-stat-bar"><div class="sys-stat-fill" style="width:${d.cpu}%"></div></div></div>
      <div class="sys-stat">MEM<div class="sys-stat-bar"><div class="sys-stat-fill" style="width:${d.memory_percent}%"></div></div></div>
      <div class="sys-stat">DSK<div class="sys-stat-bar"><div class="sys-stat-fill" style="width:${d.disk_percent}%"></div></div></div>
    `;
  } catch {}
}

function updateCounts() {
  const cats = ['Developer','Media','System','Productivity'];
  document.getElementById('cnt-all').textContent = plugins.length;
  cats.forEach(c => {
    const el = document.getElementById('cnt-' + c);
    if (el) el.textContent = plugins.filter(p => p.category === c).length;
  });
  document.getElementById('enabled-n').textContent = plugins.filter(p => p.enabled).length;
}

function render() {
  const q = searchQuery.toLowerCase();
  const filtered = plugins.filter(p => {
    const matchCat = activeCategory === 'All' || p.category === activeCategory;
    const matchQ = !q || p.name.includes(q) || p.description.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  document.getElementById('grid-title').textContent = activeCategory === 'All' ? 'All Plugins' : activeCategory;
  document.getElementById('grid-sub').textContent = filtered.length + ' plugin' + (filtered.length !== 1 ? 's' : '');

  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">◎</div><p>No plugins match your search.</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const badgeClass = CAT_BADGE[p.category] || '';
    const snapBadge = p.snap ? `<span class="badge badge-snap">snap: ${p.snap}</span>` : '';
    const snapHint = p.snap && !p.enabled
      ? `<span class="snap-hint">requires <code>sudo snap install ${p.snap}</code></span>`
      : '<span></span>';
    return `
      <div class="card ${p.enabled ? 'enabled' : ''}" id="card-${p.name}">
        <div class="card-top">
          <div class="card-icon" style="color:${p.color}">${p.icon}</div>
          <div class="card-info">
            <div class="card-name">${p.name}</div>
            <div class="card-badges">
              <span class="badge ${badgeClass}">${p.category}</span>
              ${snapBadge}
            </div>
          </div>
          <label class="toggle" title="${p.enabled ? 'Disable' : 'Enable'} ${p.name}">
            <input type="checkbox" ${p.enabled ? 'checked' : ''} onchange="togglePlugin('${p.name}', this.checked)">
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="card-desc">${p.description.split('  ')[0]}</div>
        <div class="card-footer">
          ${snapHint}
        </div>
      </div>`;
  }).join('');
}

async function togglePlugin(name, enabled) {
  const plugin = plugins.find(p => p.name === name);
  if (!plugin) return;
  const prev = plugin.enabled;
  plugin.enabled = enabled;

  // Optimistic UI
  const card = document.getElementById('card-' + name);
  if (card) card.classList.toggle('enabled', enabled);
  document.getElementById('enabled-n').textContent = plugins.filter(p => p.enabled).length;

  try {
    const endpoint = enabled ? 'enable' : 'disable';
    const res = await fetch(`/api/plugins/${name}/${endpoint}`, { method: 'POST' });
    if (!res.ok) throw new Error();

    if (plugin.snap && enabled) {
      toast(`Enabled ${name}. If not installed: sudo snap install ${plugin.snap}`);
    } else {
      toast(enabled ? `${name} enabled` : `${name} disabled`);
    }
    render();
    updateCounts();
  } catch {
    // Revert on failure
    plugin.enabled = prev;
    if (card) card.classList.toggle('enabled', prev);
    document.getElementById('enabled-n').textContent = plugins.filter(p => p.enabled).length;
    toast('Failed to update — is FlowOS running?');
  }
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

// Category buttons
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = btn.dataset.cat;
    render();
  });
});

// Search
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

// Launch
document.getElementById('btn-launch').addEventListener('click', async () => {
  try {
    await fetch('/api/launch', { method: 'POST' });
    toast('FlowOS launched in terminal.');
  } catch {
    toast('Could not launch terminal — run: python3 flowos.py');
  }
});

// Init
fetchPlugins();
fetchSystem();
setInterval(fetchSystem, 8000);

// ── SNAP STORE ──────────────────────────────────────────────
let currentSnapCategory = '';
let installedSnaps = new Set();

function setMode(mode) {
  const isSnap = mode === 'snaps';
  document.body.classList.toggle('snap-mode', isSnap);
  document.getElementById('tab-plugins').classList.toggle('active', !isSnap);
  document.getElementById('tab-snaps').classList.toggle('active', isSnap);
  if (isSnap && !document.getElementById('snap-grid').children.length) {
    loadSnaps('', '');
  }
}

function snapCategory(btn, cat) {
  document.querySelectorAll('.snap-sidebar .cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSnapCategory = cat;
  document.getElementById('snap-search').value = '';
  const label = btn.textContent.trim().replace(/^\S+\s*/, '');
  document.getElementById('snap-title').textContent = label || 'Featured Snaps';
  loadSnaps('', cat);
}

function doSnapSearch() {
  const q = document.getElementById('snap-search').value.trim();
  if (!q) return;
  document.querySelectorAll('.snap-sidebar .cat-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('snap-title').textContent = `Results for "${q}"`;
  loadSnaps(q, '');
}

async function loadSnaps(q, category) {
  const grid = document.getElementById('snap-grid');
  grid.innerHTML = '<div class="snap-state"><div class="snap-spinner"></div><br>Searching Snap Store…</div>';
  document.getElementById('snap-sub').textContent = '';

  try {
    const params = new URLSearchParams();
    if (q) params.set('q', q);
    if (category) params.set('category', category);
    const res = await fetch('/api/snaps/search?' + params);
    if (!res.ok) throw new Error(await res.text());
    const snaps = await res.json();
    renderSnaps(snaps);
  } catch (e) {
    grid.innerHTML = `<div class="snap-state">⚠ Could not reach Snap Store.<br><small style="margin-top:8px;display:block;font-family:monospace">${e.message||'Network error'}</small></div>`;
  }
}

function renderSnaps(snaps) {
  const grid = document.getElementById('snap-grid');
  document.getElementById('snap-sub').textContent = snaps.length + ' snap' + (snaps.length !== 1 ? 's' : '');

  if (!snaps.length) {
    grid.innerHTML = '<div class="snap-state">◎ No snaps found.</div>';
    return;
  }

  grid.innerHTML = snaps.map(s => {
    const icon = s.icon
      ? `<img class="snap-icon" src="${s.icon}" alt="" onerror="this.outerHTML='<div class=snap-icon-ph>◈</div>'">`
      : `<div class="snap-icon-ph">◈</div>`;
    const done = installedSnaps.has(s.name);
    return `
      <div class="snap-card">
        <div class="snap-card-top">
          ${icon}
          <div class="snap-info">
            <div class="snap-title">${esc(s.title)}</div>
            <div class="snap-pub">${esc(s.publisher)}</div>
          </div>
        </div>
        <div class="snap-summary">${esc(s.summary)}</div>
        <div class="snap-footer">
          <span class="snap-ver">${esc(s.version)}</span>
          <button class="btn-install ${done ? 'done' : ''}" id="snap-btn-${esc(s.name)}"
                  onclick="installSnap('${esc(s.name)}', this)" ${done ? 'disabled' : ''}>
            ${done ? '✓ Installed' : 'Install'}
          </button>
        </div>
      </div>`;
  }).join('');
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function installSnap(name, btn) {
  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = 'Installing…';
  try {
    const res = await fetch('/api/snaps/install', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name})
    });
    const d = await res.json();
    if (d.ok) {
      installedSnaps.add(name);
      btn.classList.remove('loading');
      btn.classList.add('done');
      btn.textContent = '✓ Installed';
      toast(`${name} installed`);
    } else {
      btn.classList.remove('loading', 'done');
      btn.disabled = false;
      btn.textContent = 'Install';
      if (d.cmd) {
        toast(`Run: ${d.cmd}`);
      } else {
        toast(`Failed to install ${name}`);
      }
    }
  } catch {
    btn.classList.remove('loading');
    btn.disabled = false;
    btn.textContent = 'Install';
    toast(`Could not reach server`);
  }
}
</script>
