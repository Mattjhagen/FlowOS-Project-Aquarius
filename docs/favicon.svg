<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#04080F"/>
  <!-- star dots -->
  <circle cx="5" cy="5" r="0.9" fill="#7DD3FC"/>
  <circle cx="27" cy="7" r="0.6" fill="#7DD3FC"/>
  <circle cx="29" cy="24" r="0.8" fill="#7DD3FC"/>
  <circle cx="4" cy="27" r="0.6" fill="#7DD3FC"/>
  <circle cx="24" cy="28" r="0.5" fill="#7DD3FC"/>
  <!-- orbital ring (back half) -->
  <ellipse cx="16" cy="16" rx="13.5" ry="5" fill="none" stroke="#00B4D8" stroke-width="1.4" stroke-dasharray="22 22" stroke-dashoffset="0" opacity="0.45" transform="rotate(-18 16 16)"/>
  <!-- planet body -->
  <circle cx="16" cy="16" r="8.5" fill="#004F7C"/>
  <!-- surface shading -->
  <circle cx="16" cy="16" r="8.5" fill="url(#planet-grad)"/>
  <!-- highlight -->
  <circle cx="13" cy="12.5" r="3.5" fill="#00B4D8" opacity="0.25"/>
  <!-- orbital ring (front half) -->
  <path d="M2.5 18.5 Q10 25 16 24 Q22 23 29.5 13.5" stroke="#00B4D8" stroke-width="1.4" fill="none" opacity="0.45"/>
  <defs>
    <radialGradient id="planet-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#001A2E" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
</svg>
